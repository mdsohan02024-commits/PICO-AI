<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PICO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --side:#E1E6F3; --card:#FFFFFF; --ink:#181C38; --mute:#666E8F; --line:#D3D9EB;
  --me:#2F45FF; --meink:#FFFFFF; --dot:#FFD84D; --code:#12162B; --codeink:#E6E9FF; --err:#C62E4B;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E1122; --side:#141830; --card:#1B2040; --ink:#ECEEFB; --mute:#8E96BE; --line:#2A3059;
  --me:#5468FF; --code:#090B17; --err:#FF6B87}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.55 var(--font);background:var(--bg);color:var(--ink);overflow:hidden}
button,textarea,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.app{display:grid;grid-template-columns:288px 1fr;height:100%}

/* sidebar */
aside{background:var(--side);display:flex;flex-direction:column;padding:16px 12px;gap:12px;border-right:1px solid var(--line);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--me);position:relative;flex:none}
.logo::after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--dot);right:6px;top:6px}
.brand b{font-size:24px;font-weight:700;letter-spacing:.04em}
.new{background:var(--me);color:#fff;border-radius:12px;padding:11px 14px;font-weight:500;text-align:left}
.new:hover{filter:brightness(1.1)}
.hist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
.hist .none{color:var(--mute);font-size:14px;padding:8px}
.item{display:flex;align-items:center;border-radius:10px}
.item:hover,.item.on{background:var(--card)}
.item .t{flex:1;text-align:left;padding:9px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.item .x{width:32px;height:32px;margin-right:4px;border-radius:8px;color:var(--mute);opacity:0}
.item:hover .x,.item .x:focus-visible{opacity:1}
.item .x:hover{color:var(--err)}
.foot{border-top:1px solid var(--line);padding-top:10px}
.foot button{width:100%;text-align:left;padding:9px 10px;border-radius:10px;color:var(--mute)}
.foot button:hover{background:var(--card);color:var(--ink)}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
header.top{display:none;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
header.top button{width:38px;height:38px;border-radius:10px;font-size:20px}
header.top b{letter-spacing:.04em}
#log{flex:1;overflow:auto;padding:28px 20px 12px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;flex-direction:column;max-width:100%}
.msg.me{align-items:flex-end}
.bub{padding:11px 16px;border-radius:18px;max-width:88%;overflow-wrap:anywhere}
.me .bub{background:var(--me);color:var(--meink);border-bottom-right-radius:6px;white-space:pre-wrap}
.ai .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.ai .bub.err{border-color:var(--err);color:var(--err)}
.ai .who{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--mute);margin:0 0 5px 4px}
.bub p+p,.bub p+ul,.bub p+ol,.bub ul+p,.bub ol+p,.bub .code+p,.bub p+.code{margin-top:10px}
.bub ul,.bub ol{padding-left:22px}
.bub h3{font-size:17px;margin:12px 0 4px}
.bub code{font-family:var(--mono);font-size:.88em;background:var(--bg);padding:1px 6px;border-radius:6px}
.code{position:relative;margin:10px 0;border-radius:12px;background:var(--code);color:var(--codeink)}
.code pre{padding:14px 16px;overflow:auto}
.code code{background:none;padding:0;color:inherit;font-size:13.5px;line-height:1.5}
.copy{position:absolute;top:8px;right:8px;font-size:12px;padding:3px 9px;border-radius:7px;background:#ffffff1f;color:var(--codeink)}
.copy:hover{background:#ffffff38}
.dots{display:inline-flex;gap:5px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}

/* empty */
.empty{margin:9vh auto 0;max-width:560px;text-align:center}
.empty .logo{width:64px;height:64px;border-radius:21px;margin:0 auto 18px}
.empty .logo::after{width:18px;height:18px;right:11px;top:11px}
.empty h1{font-size:clamp(30px,6vw,44px);line-height:1.1;font-weight:700}
.empty p{color:var(--mute);margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.chips button{background:var(--card);border:1px solid var(--line);padding:9px 15px;border-radius:999px;font-size:15px}
.chips button:hover{border-color:var(--me)}

/* composer */
.comp{padding:8px 20px 18px}
.box{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px}
.box:focus-within{border-color:var(--me);box-shadow:0 0 0 3px #2F45FF26}
textarea{flex:1;border:0;background:none;resize:none;outline:0;max-height:180px;padding:7px 0;line-height:1.45}
textarea::placeholder{color:var(--mute)}
#send{width:40px;height:40px;border-radius:14px;background:var(--me);color:#fff;font-size:18px;flex:none}
#send:disabled{opacity:.35;cursor:default}
#send.stop{background:var(--ink);color:var(--bg)}
.note{max-width:760px;margin:8px auto 0;text-align:center;font-size:12.5px;color:var(--mute)}

/* dialog */
dialog{margin:auto;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:24px;width:min(440px,92vw)}
dialog::backdrop{background:#0a0d2088}
dialog h2{font-size:20px;margin-bottom:14px}
dialog label{display:block;font-weight:500;font-size:14px;margin:14px 0 5px}
dialog input,dialog select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
dialog small{display:block;color:var(--mute);margin-top:6px;font-size:13px}
.row{display:flex;gap:8px;justify-content:space-between;margin-top:22px}
.row button{padding:10px 16px;border-radius:10px;border:1px solid var(--line)}
.row .go{background:var(--me);color:#fff;border-color:var(--me);font-weight:500}
.row .danger{color:var(--err)}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:292px;z-index:5;transform:translateX(-100%);transition:transform .2s}
  body.open aside{transform:none;box-shadow:0 0 0 100vmax #0a0d2088}
  header.top{display:flex}
  .bub{max-width:94%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="logo"></div><b>PICO</b></div>
    <button class="new" id="newChat">+ New chat</button>
    <nav class="hist" id="hist" aria-label="Chat history"></nav>
    <div class="foot"><button id="openSet">Settings</button></div>
  </aside>

  <main>
    <header class="top"><button id="menu" aria-label="Open menu">☰</button><b>PICO</b></header>
    <div id="log"><div class="wrap" id="wrap"></div></div>
    <div class="comp">
      <div class="box">
        <textarea id="in" rows="1" placeholder="Message PICO" aria-label="Message PICO"></textarea>
        <button id="send" aria-label="Send message" disabled>↑</button>
      </div>
      <p class="note">PICO can make mistakes. Check important information.</p>
    </div>
  </main>
</div>

<dialog id="set">
  <h2>Settings</h2>
  <label for="key">Anthropic API key</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
  <small>Saved only in this browser. Never put your key in the code you upload to GitHub.</small>
  <label for="model">Model</label>
  <select id="model">
    <option value="claude-sonnet-5-5">Sonnet 5.5 (balanced)</option>
    <option value="claude-haiku-5-5">Haiku 5.5 (fastest)</option>
    <option value="claude-opus-5-5">Opus 5.5 (most capable)</option>
  </select>
  <div class="row">
    <button class="danger" id="wipe">Delete all chats</button>
    <span style="display:flex;gap:8px"><button id="cancel">Cancel</button><button class="go" id="save">Save</button></span>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const SYSTEM = "You are PICO, a friendly, clear and concise AI assistant. Use short paragraphs, and use markdown for lists and code.";
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
let chats = store.get("pico_chats", []);
let cur = store.get("pico_cur", null);
let key = store.get("pico_key", "");
let model = store.get("pico_model", "claude-sonnet-5-5");
let busy = false, ctrl = null;

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const chat = () => chats.find(c => c.id === cur);
const save = () => { store.set("pico_chats", chats); store.set("pico_cur", cur); };

/* tiny markdown renderer */
function inline(s){
  return s.replace(/`([^`\n]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
          .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}
function md(text){
  const blocks = [];
  let t = esc(text).replace(/```(\w*)\n?([\s\S]*?)(```|$)/g, (m, l, c) => {
    blocks.push('<div class="code"><button class="copy">Copy</button><pre><code>' + c.replace(/\n$/, "") + "</code></pre></div>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  let out = "", list = null;
  const close = () => { if (list){ out += "</" + list + ">"; list = null; } };
  for (const line of t.split("\n")){
    let m;
    if ((m = line.match(/^\u0000(\d+)\u0000$/))){ close(); out += blocks[m[1]]; }
    else if ((m = line.match(/^\s*[-*] (.*)/))){ if (list !== "ul"){ close(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = line.match(/^\s*\d+\. (.*)/))){ if (list !== "ol"){ close(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = line.match(/^#{1,3} (.*)/))){ close(); out += "<h3>" + inline(m[1]) + "</h3>"; }
    else if (!line.trim()){ close(); }
    else { close(); out += "<p>" + inline(line) + "</p>"; }
  }
  close();
  return out;
}

/* rendering */
function renderHist(){
  const h = $("#hist");
  h.innerHTML = "";
  if (!chats.length){ h.innerHTML = '<p class="none">Your chats will show up here.</p>'; return; }
  for (const c of chats){
    const d = document.createElement("div");
    d.className = "item" + (c.id === cur ? " on" : "");
    d.innerHTML = '<button class="t"></button><button class="x" aria-label="Delete chat">✕</button>';
    d.firstChild.textContent = c.title;
    d.firstChild.onclick = () => openChat(c.id);
    d.lastChild.onclick = () => delChat(c.id);
    h.appendChild(d);
  }
}
function msgEl(role, html, cls){
  const m = document.createElement("div");
  m.className = "msg " + (role === "user" ? "me" : "ai");
  m.innerHTML = (role === "user" ? "" : '<div class="who">PICO</div>') + '<div class="bub' + (cls ? " " + cls : "") + '"></div>';
  const b = m.querySelector(".bub");
  if (role === "user") b.textContent = html; else b.innerHTML = html;
  return m;
}
function renderChat(){
  const w = $("#wrap");
  w.innerHTML = "";
  const c = chat();
  if (!c || !c.messages.length){
    w.innerHTML = '<div class="empty"><div class="logo"></div><h1>Hi, I\u2019m PICO.</h1><p>Ask me anything, or start with one of these.</p><div class="chips"></div></div>';
    for (const s of ["Explain how the internet works", "Write a short poem about rain", "Help me plan a study schedule", "Give me a fun fact"]){
      const b = document.createElement("button");
      b.textContent = s;
      b.onclick = () => { $("#in").value = s; send(); };
      w.querySelector(".chips").appendChild(b);
    }
  } else {
    for (const m of c.messages) w.appendChild(msgEl(m.role, m.role === "user" ? m.content : md(m.content)));
  }
  renderHist();
  scrollEnd();
}
function scrollEnd(){ const l = $("#log"); l.scrollTop = l.scrollHeight; }

function newChat(){
  const c = chat();
  if (c && !c.messages.length){ closeMenu(); $("#in").focus(); return; }
  const n = { id: uid(), title: "New chat", messages: [] };
  chats.unshift(n); cur = n.id; save(); renderChat(); closeMenu(); $("#in").focus();
}
function openChat(id){ if (busy) return; cur = id; save(); renderChat(); closeMenu(); }
function delChat(id){
  if (busy) return;
  chats = chats.filter(c => c.id !== id);
  if (cur === id) cur = chats[0] ? chats[0].id : null;
  save(); renderChat();
}

/* sending */
function setBusy(b){
  busy = b;
  const s = $("#send");
  s.classList.toggle("stop", b);
  s.textContent = b ? "■" : "↑";
  s.setAttribute("aria-label", b ? "Stop" : "Send message");
  s.disabled = b ? false : !$("#in").value.trim();
}
async function send(){
  const inp = $("#in"), text = inp.value.trim();
  if (!text || busy) return;
  if (!key){ openSettings(); return; }
  if (!chat()) newChat();
  const c = chat();
  c.messages.push({ role: "user", content: text });
  if (c.messages.length === 1) c.title = text.length > 40 ? text.slice(0, 40) + "\u2026" : text;
  inp.value = ""; grow(); save(); renderChat();

  const el = msgEl("assistant", '<span class="dots"><i></i><i></i><i></i></span>');
  $("#wrap").appendChild(el); scrollEnd();
  const bub = el.querySelector(".bub");
  let full = "";
  setBusy(true); ctrl = new AbortController();
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST", signal: ctrl.signal,
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model, max_tokens: 2000, stream: true, system: SYSTEM,
        messages: c.messages.map(m => ({ role: m.role, content: m.content })) })
    });
    if (!res.ok){
      let msg = "Request failed (" + res.status + ").";
      try { msg = (await res.json()).error.message; } catch {}
      throw new Error(msg);
    }
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true){
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const ln of lines){
        if (!ln.startsWith("data: ")) continue;
        try {
          const j = JSON.parse(ln.slice(6));
          if (j.type === "content_block_delta" && j.delta && j.delta.text){
            full += j.delta.text; bub.innerHTML = md(full); scrollEnd();
          } else if (j.type === "error") throw new Error(j.error.message);
        } catch (e){ if (e.message && !(e instanceof SyntaxError)) throw e; }
      }
    }
    if (!full) throw new Error("PICO sent an empty reply. Try again.");
    c.messages.push({ role: "assistant", content: full });
  } catch (e){
    if (e.name === "AbortError"){
      if (full) c.messages.push({ role: "assistant", content: full });
      else { c.messages.pop(); inp.value = text; grow(); }
    } else {
      c.messages.pop(); inp.value = text; grow();
      bub.classList.add("err");
      bub.textContent = /api[-_ ]?key|authentication|401/i.test(e.message)
        ? "Your API key was not accepted. Check it in Settings."
        : e.message;
      setBusy(false); ctrl = null; save(); renderHist();
      return;
    }
  }
  setBusy(false); ctrl = null; save(); renderChat();
}

/* input */
function grow(){ const t = $("#in"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 180) + "px"; $("#send").disabled = busy ? false : !t.value.trim(); }
$("#in").addEventListener("input", grow);
$("#in").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } });
$("#send").onclick = () => busy ? ctrl && ctrl.abort() : send();
$("#newChat").onclick = newChat;
$("#wrap").addEventListener("click", e => {
  if (e.target.classList.contains("copy")){
    navigator.clipboard.writeText(e.target.nextElementSibling.innerText);
    e.target.textContent = "Copied";
    setTimeout(() => e.target.textContent = "Copy", 1500);
  }
});

/* menu + settings */
const closeMenu = () => document.body.classList.remove("open");
$("#menu").onclick = () => document.body.classList.toggle("open");
$("#log").addEventListener("click", closeMenu);
function openSettings(){ $("#key").value = key; $("#model").value = model; $("#set").showModal(); }
$("#openSet").onclick = openSettings;
$("#cancel").onclick = () => $("#set").close();
$("#save").onclick = () => {
  key = $("#key").value.trim(); model = $("#model").value;
  store.set("pico_key", key); store.set("pico_model", model);
  $("#set").close(); $("#in").focus();
};
$("#wipe").onclick = () => {
  if (!confirm("Delete all chats? This can't be undone.")) return;
  chats = []; cur = null; save(); renderChat(); $("#set").close();
};

if (!chat()) cur = chats[0] ? chats[0].id : null;
renderChat();
</script>
</body>
</html>
